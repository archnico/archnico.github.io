<text x="57" y="683" font-family="sans-serif" font-size="15" font-weight="400" fill="#183b4c" text-anchor="start">A: due traversine a L25×15×2, lunghezza 225; asole 26,5×6,5 soltanto ipotesi. Cover e viti OEM da rilevare.</text>
