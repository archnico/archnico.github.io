<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UX Enhancements DOM Test</title>
<style>
 body{font-family:system-ui,sans-serif;background:#0a121b;color:#e3f1f1;padding:20px}
 #log{white-space:pre-wrap;font-family:monospace;background:#102834;border:1px solid #254653;padding:12px;border-radius:8px;max-height:80vh;overflow:auto}
 .pass{color:#64d6c4}.fail{color:#e78b86}
 /* minimal mocks */
 .left{width:200px;background:#0b1b26}.left.open{display:block}.left.collapsed{display:none}
 .quick{border:1px solid #35515a;background:#18313c;color:#edfafa}
 .switch[aria-checked="true"]{background:#1e6657}
 .help-panel{padding:10px;background:#0d202c;border:1px solid #4b7781}
 .help-panel[hidden]{display:none}
 .selection-hud{padding:5px;background:#062329;border:1px solid #4d9d92}
 .selection-hud[hidden]{display:none}
 .selection-hud.active{display:block}
</style>
</head>
<body>
<h1>UX Enhancements — DOM interaction tests</h1>
<div id="log"></div>

<!-- Minimal DOM matching the IDs/classes the enhancements script expects -->
<button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="left-panel">☰</button>
<aside class="left" id="left-panel">sidebar</aside>
<section class="viewport" id="vp" style="width:200px;height:200px;background:#111">
 <div class="selection-hud" id="selection-hud" hidden><span class="hud-label">Selezionato</span><strong id="hud-title">—</strong><button id="focus-selected">Focus</button></div>
 <button id="fullscreen-btn">FS</button>
 <button id="help-btn" aria-expanded="false">?</button>
 <div class="help-panel" id="help-panel" hidden role="dialog" aria-modal="true" aria-labelledby="help-title"><button class="close">x</button><h3 id="help-title">Aiuto</h3></div>
</section>
<aside class="right" id="inspector" hidden><h3 id="part-title">Test Part</h3></aside>

<!-- Layer switches used by enhancements.js -->
<button class="switch" data-layer="semitrasparente" aria-checked="false">semi</button>
<button class="switch" data-layer="isola" aria-checked="false">isola</button>
<button id="qfit">fit</button>

<script src="../assets/viewer-enhancements.js"></script>
<script>
const log = document.getElementById('log');
let pass = 0, fail = 0;
function assert(cond, msg) {
  if (cond) { pass++; log.innerHTML += '<span class="pass">PASS</span> ' + msg + '\n'; }
  else { fail++; log.innerHTML += '<span class="fail">FAIL</span> ' + msg + '\n'; }
}
function $(id){ return document.getElementById(id); }
function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

(async function run(){
// Test 1: menu toggle opens/closes sidebar
const menu = $('menu-toggle');
const left = $('left-panel');
menu.click();
assert(left.classList.contains('open') && menu.getAttribute('aria-expanded') === 'true', 'menu toggle opens sidebar');
menu.click();
assert(!left.classList.contains('open') && menu.getAttribute('aria-expanded') === 'false', 'menu toggle closes sidebar');

// Test 2: help panel toggles
const helpBtn = $('help-btn');
const helpPanel = $('help-panel');
helpBtn.click();
assert(!helpPanel.hidden && helpBtn.getAttribute('aria-expanded') === 'true', 'help button opens panel');
helpPanel.querySelector('.close').click();
assert(helpPanel.hidden && helpBtn.getAttribute('aria-expanded') === 'false', 'help close button closes panel');

// Test 3: selection HUD reacts to inspector visibility (MutationObserver is async)
const inspector = $('inspector');
const hud = $('selection-hud');
const title = $('part-title');
inspector.hidden = false;
await wait(50);
assert(hud.classList.contains('active') && $('hud-title').textContent === title.textContent, 'HUD shows when inspector visible');
inspector.hidden = true;
await wait(50);
assert(!hud.classList.contains('active'), 'HUD hides when inspector hidden');

// Test 4: focus-selected enables semi/isola switches and clicks fit
const semi = document.querySelector('[data-layer="semitrasparente"]');
const isola = document.querySelector('[data-layer="isola"]');
let fitClicked = 0;
$('qfit').addEventListener('click', () => fitClicked++);
inspector.hidden = false;
await wait(50);
// auto-isolate already turned them on; reset to off to verify focus button
semi.setAttribute('aria-checked','false');
isola.setAttribute('aria-checked','false');
$('focus-selected').click();
assert(semi.getAttribute('aria-checked') === 'true' && isola.getAttribute('aria-checked') === 'true', 'focus button enables semi-transparent and isolate layers');
assert(fitClicked > 0, 'focus button clicks fit control');

// Test 5: fullscreen button exists
assert(!!$('fullscreen-btn'), 'fullscreen button present');

// Test 6: viewport pointer handlers do not throw
const vp = $('vp');
let err = null;
try {
  vp.dispatchEvent(new PointerEvent('pointerdown', { pointerId: 1, clientX: 10, clientY: 10 }));
  vp.dispatchEvent(new PointerEvent('pointerup', { pointerId: 1, clientX: 10, clientY: 10 }));
} catch(e){ err = e; }
assert(!err, 'viewport pointer handlers do not throw: ' + (err || ''));

// Test 7: keyboard shortcuts do not throw on mock
err = null;
try {
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'h', bubbles: true }));
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'i', bubbles: true }));
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'x', bubbles: true }));
} catch(e){ err = e; }
assert(!err, 'keyboard shortcut handlers do not throw: ' + (err || ''));

log.innerHTML += '\n' + (fail === 0 ? '<span class="pass">ALL PASSED</span>' : '<span class="fail">' + fail + ' FAILED</span>') + ' (' + pass + ' passed)';
})();
</script>
</body>
</html>
