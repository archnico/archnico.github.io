<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UX Round 4 — DOM interaction tests</title>
<style>
 body{font-family:system-ui,sans-serif;background:#0a121b;color:#e3f1f1;padding:20px}
 #log{white-space:pre-wrap;font-family:monospace;background:#102834;border:1px solid #254653;padding:12px;border-radius:8px;max-height:80vh;overflow:auto}
 .pass{color:#64d6c4}.fail{color:#e78b86}
 .left{width:200px;background:#0b1b26}.left.open{display:block}.left.collapsed{display:none}
 .quick{border:1px solid #35515a;background:#18313c;color:#edfafa}
 .switch[aria-checked="true"]{background:#1e6657}
 .help-panel{padding:10px;background:#0d202c;border:1px solid #4b7781}
 .help-panel[hidden]{display:none}
 .selection-hud{padding:5px;background:#062329;border:1px solid #4d9d92}
 .selection-hud[hidden]{display:none}
 .selection-hud.active{display:block}
 .viewport{width:200px;height:200px;background:#111;position:relative}
 .eng-chip{font-size:9px;padding:3px 7px;border-radius:999px;border:1px solid #3a5a63;background:#132a33;color:#cfe7e3;margin:2px}
 .eng-chip.critical{border-color:#e78b86;background:#3a2424;color:#ffd0cc}
</style>
</head>
<body>
<h1>UX Round 4 — DOM interaction tests</h1>
<div id="log"></div>

<aside class="left" id="left-panel">sidebar</aside>
<section class="viewport" id="vp">
 <div class="selection-hud" id="selection-hud" hidden><span class="hud-label">Selezionato</span><strong id="hud-title">—</strong><button id="focus-selected">Focus</button></div>
</section>
<aside class="right" id="inspector" hidden><h3 id="part-title">Test Part</h3></aside>

<button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="left-panel">☰</button>
<button id="fullscreen-btn">FS</button>
<button id="help-btn" aria-expanded="false">?</button>
<div class="help-panel" id="help-panel" hidden role="dialog" aria-modal="true" aria-labelledby="help-title"><button class="close">x</button><h3 id="help-title">Aiuto</h3></div>
<button class="switch" data-layer="semitrasparente" aria-checked="false">semi</button>
<button class="switch" data-layer="isola" aria-checked="false">isola</button>
<button class="switch" data-layer="etichette" aria-checked="true">etichette</button>
<button id="qfit">fit</button>

<div class="eng-grid" id="eng-blockers" aria-label="Bloccanti di ingegneria">
 <span class="eng-chip critical" data-blocker="mass">Massa non verificata</span>
 <span class="eng-chip critical" data-blocker="psu">PSU non collocati</span>
 <span class="eng-chip critical" data-blocker="approval">Non approvato per costruzione</span>
 <span class="eng-chip ok" data-blocker="no-hdd">NO HDD in H7</span>
</div>
<div class="viewmark">FB-1 · STUDIO · NON ESECUTIVO · NON APPROVATO PER COSTRUZIONE</div>

<script src="../assets/viewer-enhancements.js"></script>
<script>
const log = document.getElementById('log');
let pass = 0, fail = 0;
function assert(cond, msg) {
  if (cond) { pass++; log.innerHTML += '<span class="pass">PASS</span> ' + msg + '\n'; }
  else { fail++; log.innerHTML += '<span class="fail">FAIL</span> ' + msg + '\n'; }
}
function $(id){ return document.getElementById(id); }
function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

(async function run(){
// Test 1: blocker chips present
const chips = document.querySelectorAll('.eng-chip');
assert(chips.length >= 4, 'engineering blocker chips present');
assert([...chips].some(c => c.getAttribute('data-blocker') === 'approval'), 'approval blocker chip present');

// Test 2: screenshot mode can be toggled via helper
const mode = window.towerScreenshotMode(true);
assert(mode === true && document.body.classList.contains('screenshot-mode'), 'screenshot mode activates');
window.towerScreenshotMode(false);
assert(!document.body.classList.contains('screenshot-mode'), 'screenshot mode deactivates');

// Test 3: viewmark keeps non-approval wording
const viewmark = document.querySelector('.viewmark');
assert(viewmark && /NON APPROVATO/i.test(viewmark.textContent), 'viewmark states non-approval');

// Test 4: selection HUD reacts to inspector visibility
const inspector = $('inspector');
const hud = $('selection-hud');
inspector.hidden = false;
await wait(50);
assert(hud.classList.contains('active'), 'HUD shows when inspector visible');

log.innerHTML += '\n' + (fail === 0 ? '<span class="pass">ALL PASSED</span>' : '<span class="fail">' + fail + ' FAILED</span>') + ' (' + pass + ' passed)';
})();
</script>
</body>
</html>
